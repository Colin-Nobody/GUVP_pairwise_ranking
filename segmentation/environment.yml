name: guvp-seg
channels:
  - conda-forge
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - cuda-nvcc=12.8
  - gcc_linux-64=13
  - gxx_linux-64=13
  - ninja
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - mmengine==0.10.7
      - mmsegmentation==1.2.2
      - opencv-python==5.0.0.93
      - pandas==2.3.3
      - ftfy==6.3.1
      - regex==2026.9.10
# mmcv==2.1.0 is installed separately as a CPU-ops source build; see README.md.
